name: Bug report
description: Report a reproducible problem in SplitCrew
title: "[BUG] "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SplitCrew.
  - type: input
    id: version
    attributes:
      label: SplitCrew version
      placeholder: v0.x.x or commit SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: Pixel 8 / Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create trip...\n2. Add expense..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or sanitized sample data. Do not post bank credentials, OTPs, secrets, or sensitive personal data.

name: Feature request
description: Propose a product or engineering improvement
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What real user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Note domain, persistence, synchronization, privacy or compatibility implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

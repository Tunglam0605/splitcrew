name: splitcrew_mobile
description: SplitCrew Android-first local-first mobile MVP.
publish_to: none
version: 0.7.0-alpha.1+7

environment:
  sdk: '>=3.4.0 <4.0.0'

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  convert: ^3.1.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  image_picker: ^1.1.2
  open_filex: ^4.7.0
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pub_semver: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  uuid: ^4.5.1
  splitcrew_domain:
    path: ../../packages/domain
  splitcrew_local_host:
    path: ../../packages/local_host
  splitcrew_payment_qr:
    path: ../../packages/payment_qr
  splitcrew_split_engine:
    path: ../../packages/split_engine
  splitcrew_settlement_engine:
    path: ../../packages/settlement_engine
  splitcrew_sync_protocol:
    path: ../../packages/sync_protocol
  splitcrew_update_core:
    path: ../../packages/update_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
